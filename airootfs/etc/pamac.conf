### Pamac configuration file - AcreetionOS overlay
## Enables AUR, Flatpak and Snap update checks via pamac.
## AppImage has no native pamac backend; AppImages are managed via
## appimagepool / Gearlever (see packages.x86_64). This file
## overrides the default /etc/pamac.conf shipped by libpamac-aur.

## When removing a package, also remove those dependencies
## that are not required by other packages (recurse option):
#RemoveUnrequiredDeps

## How often to check for updates, value in hours (0 to disable):
RefreshPeriod = 3

## When no update is available, hide the tray icon:
#NoUpdateHideIcon

## When applying updates, enable packages downgrade:
#EnableDowngrade

## When installing packages, do not check for updates:
#SimpleInstall

## Allow Pamac to search and install packages from AUR:
EnableAUR

## Keep built packages from AUR in cache after installation:
KeepBuiltPkgs

## When AUR support is enabled check for updates from AUR:
CheckAURUpdates

## When check updates from AUR support is enabled check for vcs updates:
CheckAURVCSUpdates

## AUR build directory:
BuildDirectory = /var/tmp

## Number of versions of each package to keep when cleaning the packages cache:
KeepNumPackages = 3

## Remove only the versions of uninstalled packages when cleaning the packages cache:
#OnlyRmUninstalled

## Download updates in background:
DownloadUpdates

## Offline upgrade:
#OfflineUpgrade

## Maximum Parallel Downloads:
MaxParallelDownloads = 10

## Flatpak and Snap support - enabled per #50.
## pamac refresh will now also check flatpak and snap updates.
## Requires flatpak / snapd backends to be installed (see packages.x86_64).
CheckFlatpakUpdates
EnableSnap
EnableFlatpak

## Note on AppImage:
## Pamac has no native AppImage backend. AcreetionOS ships
## appimagepool (AppImageHub client) and libappimage for
## AppImage integration. Gearlever is available via the acur
## repo for full desktop integration and update checks.
